<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwO 桌宠</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!--
      桌宠页由内核静态托管（`GET /pet` → desktop/web/pet），改完前端刷新窗口即可，
      无需重新构建壳。它的形态有两个前提：
        * 全站认证出口 core/api-client.js（同源 `/core/...`）必须在这里先加载，
          否则 OwoApi 缺失，桌宠拿不到 pairing/instance 头而永远停在 idle；
        * 页面内不允许 Node 权限，一切窗口行为走 preload 注入的 window.petShell。
    -->
    <div id="feed-food" aria-hidden="true"></div>
    <button
      class="pet idle"
      id="pet"
      aria-label="OwO 桌宠"
      title="左键点我摸摸头；右键打开操作菜单（允许 / 拒绝审批 · 停止回合 · 打开工作台 · 换形象 · 隐藏）；拖动可移动"
    >
      <span class="halo"></span>
      <div class="avatar" id="pet-avatar" role="img" aria-label="OwO 桌宠形象">
        <img id="pet-avatar-img" src="" alt="" draggable="false" />
      </div>
      <span class="fx-layer" id="fx" aria-hidden="true"></span>
      <span class="bubble" id="bubble">OwO</span>
    </button>
    <div class="skin-menu" id="skin-menu" hidden></div>
    <script src="/core/api-client.js"></script>
    <script src="pet.js"></script>
    <script src="feed-controller.js"></script>
  </body>
</html>
