[package]
name = "owo-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
owo-agent-core.workspace = true
base64.workspace = true
# `owo-agent product-eval` 子命令的评测面经门面引入（core 自身不持有评测面，见
# crates/owo-agent-eval-facade/Cargo.toml 的环依赖说明）。
owo-agent-eval-facade.workspace = true
owo-agent-server.workspace = true
# §2.3：Daemon 发现描述符契约（core_ready 后写 runtime/daemon.json）。
owo-agent-protocol.workspace = true
# §7.1 P1：CLI/TUI 经唯一共享客户端访问 Daemon（turn/repl/daemon 子命令）。
owo-agent-client.workspace = true
# §6.1.2：共享构建身份（编译期烧录的 git commit/dirty/epoch），替代本 crate 的 build.rs。
owo-build-info.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline = "14"
colored = "2"
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
ratatui = "0.29"
crossterm = "0.28"

# §5.3 TUI 快照测试：宽字符续格识别（unicode-width 与 ratatui 同源，避免宽度口径漂移）。
[dev-dependencies]
unicode-width = "0.2"

[[bin]]
name = "owo-agent"
path = "src/main.rs"

# product-eval preflight 的磁盘剩余空间检查（GetDiskFreeSpaceExW，仅 Windows）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
