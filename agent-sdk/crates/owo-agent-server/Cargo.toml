[package]
name = "owo-agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
owo-agent-protocol.workspace = true
owo-agent-core = { workspace = true, features = ["stt"] }
# ProductEval 评测面经门面引入（/product-eval/*、/eval/*、/desktop-envs/* 的
# dataset_builder）。core 自身不持有评测面：devtools/product-eval 反向依赖 core，
# 若让 core 再依赖它会形成 Cargo 环（详见 crates/owo-agent-eval-facade/Cargo.toml）。
owo-agent-eval-facade.workspace = true
# 环境内核（M5）：desktop_env 现由 owo-agent-env 提供（/desktop-envs/* 路由）。
owo-agent-env.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tokio-stream.workspace = true
async-trait.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
reqwest.workspace = true
sha2.workspace = true
hmac = "0.12.1"
zeroize = "1.9.0"
zip.workspace = true
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors"] }
# §6.1.2：共享构建身份（编译期烧录的 git commit/dirty/epoch），替代本 crate 的 build.rs。
owo-build-info.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
