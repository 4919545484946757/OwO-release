<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 · OwO 自定义项目验收清单</title><style>:root{color-scheme:light dark;--b:#f4f7fb;--p:#fff;--t:#172238;--m:#617188;--l:#dce4ee;--a:#336de0}@media(prefers-color-scheme:dark){:root{--b:#0f1723;--p:#1a2638;--t:#e9f1fb;--m:#afbdd0;--l:#39495e;--a:#92b6ff}}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:36px 22px 80px}a{color:var(--a)}header{border-bottom:1px solid var(--l);padding-bottom:22px}small{color:var(--a);font-weight:700;letter-spacing:.1em}h1{font-size:clamp(32px,5vw,52px);margin:12px 0}h2{margin:0;font-size:21px}p{color:var(--m)}.group{background:var(--p);border:1px solid var(--l);border-radius:15px;margin:20px 0;padding:22px}.group p{margin:3px 0 14px}label{display:flex;gap:12px;align-items:start;border-top:1px solid var(--l);padding:13px 0;cursor:pointer}label:last-child{padding-bottom:0}input{accent-color:var(--a);width:17px;height:17px;margin-top:4px}.evidence{display:block;color:var(--m);font-size:13px}.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}</style></head><body><main><header><small>06 / ACCEPTANCE</small><h1>自定义项目验收清单</h1><p>用于基于 OwO 二次开发或引入输入方案、词典、插件的交付评审。勾选状态只留在当前页面内；正式结果应另行记录。</p></header><section class="group"><h2>范围与构建</h2><p>先冻结交付物，再判断测试是否覆盖该版本。</p><label><input type="checkbox"><span>明确目标 Windows 版本、输入方案、插件权限、离线能力、可选模型和不做项。<span class="evidence">证据：需求基线、变更记录。</span></span></label><label><input type="checkbox"><span>Debug/Release 构建通过，版本号、安装包与源代码提交一致。<span class="evidence">证据：CMake、.NET 构建日志及发行清单。</span></span></label></section><section class="group"><h2>输入与候选</h2><label><input type="checkbox"><span>目标应用中能激活 TSF；输入、纠错、简拼、手动分割、分页、展开、鼠标选择与部分上屏可复测。<span class="evidence">证据：应用名、输入串、期望候选、截图或回放。</span></span></label><label><input type="checkbox"><span>焦点切换、取消、重连、超时与过期请求不会把旧候选覆盖到新窗口。<span class="evidence">证据：TSF/IPC 定向测试和实机步骤。</span></span></label><label><input type="checkbox"><span>固定候选集记录首选、首屏、Top-K、分页一致性和延迟；与上一版本比较。<span class="evidence">证据：开发 CLI 的版本化质量报告。</span></span></label></section><section class="group"><h2>数据与扩展</h2><label><input type="checkbox"><span>配置、独立词库和用户词频的增删改、备份、导入导出及重启持久化通过。<span class="evidence">证据：错误文件与版本冲突案例。</span></span></label><label><input type="checkbox"><span>插件最小权限、逐版本授权、取消、超时、非法响应和旧会话结果经过验证。<span class="evidence">证据：manifest、授权测试与插件宿主日志。</span></span></label><label><input type="checkbox"><span>敏感输入框不采集上下文；Agent 展示文本不能直接变成系统操作。<span class="evidence">证据：安全场景手测与协议拒绝测试。</span></span></label></section><section class="group"><h2>体验与发行</h2><label><input type="checkbox"><span>深浅主题、缩放和不同分辨率下候选框、设置中心、安装助手无明显溢出或闪烁。<span class="evidence">证据：人工视觉验收。</span></span></label><label><input type="checkbox"><span>干净 Windows 11 环境测试安装、升级、卸载和失败恢复；模型不可用时仍有基础候选。<span class="evidence">证据：虚拟机/实机记录及失败注入。</span></span></label><label><input type="checkbox"><span>核对发行包 SHA-256、许可文件、迁移说明与已知限制。<span class="evidence">证据：发布清单与签收人。</span></span></label></section><p>验收结论应记录“通过 / 未通过 / 不适用”、测试环境和责任人。本页是模板，不声明当前版本已完成所有扩展项。</p><div class="nav"><a href="05-api-data-design.html">← 05 API 与数据</a><a href="07-project-structure-standards.html">07 结构与规范 →</a></div></main></body></html>
