# 集成工作流（master / agent-frame）：输入法 / 网关 / 协议契约 / Agent 边界
# 只读权限，无发布、无密钥。agent-sdk 自身的门禁仍在 agent-sdk/.github/workflows。
name: CI - integration

on:
  pull_request:
    paths:
      - 'ime/**'
      - 'gateway/**'
      - 'contracts/**'
      - 'agent-sdk/crates/owo-agent-protocol/**'
      - 'agent-sdk/scripts/check-agent-boundary.py'
      - '.github/workflows/integration.yml'
  push:
    branches: [ master, agent-frame ]

permissions:
  contents: read

concurrency:
  group: ci-integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts + agent boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python contracts/agent-ipc/check_fixtures.py
      - run: python agent-sdk/scripts/check-agent-boundary.py

  gateway:
    name: intent gateway (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './gateway -> ./gateway/target'
      - name: fmt
        working-directory: gateway
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: gateway
        run: cargo clippy --locked -j 2 --all-targets -- -D warnings
      - name: test
        working-directory: gateway
        run: cargo test --locked -j 2 -- --test-threads=2

  ime:
    name: input method (Windows)
    # Match the VS 2022 generator; latest may move to a newer VS-only image.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: configure
        working-directory: ime
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: build
        working-directory: ime
        run: cmake --build build/ci --config Debug -j 2
      - name: test
        working-directory: ime
        run: ctest --test-dir build/ci -C Debug -j 2 --output-on-failure
